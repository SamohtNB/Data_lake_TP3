stages:

  download_data:
    cmd: python build/import_data.py --output_dir data/raw
    outs:
      - data/raw

  upload_raw:
    cmd: python build/unpack_to_raw.py --input_dir data/raw --bucket_name raw --output_file_name combined_text.txt
    deps:
      - data/raw
    outs:
      - data/raw/combined_text.txt

  preprocess_to_staging:
    cmd: >
      python src/preprocess_to_staging.py
      --bucket_raw raw
      --db_host localhost
      --db_user root
      --db_password root
      --db_name staging
    deps:
      - tmp/combined_text.txt
    outs:
      - staging.db  # Optionnel : dump de la DB si souhaité

  staging_to_curated:
    cmd: python src/process_to_curated.py
    deps:
      - staging.db  # si dumpé

  check_curated:
    cmd: python src/check_db.py
    deps:
      - curated.db  # si dumpé

  
